spring.application.name=minecraft-monitor
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minecraft_monitor}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.name=${APP_USERNAME:admin}
spring.security.user.password=${APP_PASSWORD:admin123}
jwt.secret=${JWT_SECRET}
jwt.expiration=3600
