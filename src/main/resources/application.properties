spring.application.name=minecraft-monitor
server.port=${PORT:8080}

spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.bootstrap.username=${APP_USERNAME:}
app.bootstrap.password=${APP_PASSWORD:}
jwt.secret=${JWT_SECRET:minha-chave-secreta-local}
jwt.expiration=3600

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

alert.email.from=${ALERT_EMAIL_FROM:}
alert.email.to=${ALERT_EMAIL_TO:}

alert.latency.threshold=${ALERT_LATENCY_THRESHOLD:500}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.mail.enabled=false
