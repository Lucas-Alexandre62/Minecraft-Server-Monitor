spring.application.name=minecraft-monitor
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minecraft_monitor}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.bootstrap.username=${APP_USERNAME:}
app.bootstrap.password=${APP_PASSWORD:}
jwt.secret=${JWT_SECRET}
jwt.expiration=3600

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

alert.email.from=${ALERT_EMAIL_FROM:}
alert.email.to=${ALERT_EMAIL_TO:}

alert.latency.threshold=${ALERT_LATENCY_THRESHOLD:500}
