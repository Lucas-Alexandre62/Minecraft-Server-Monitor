services:
  - type: web
    name: minecraft-monitor
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: PORT
        value: "10000"

      - key: DB_HOST
        fromDatabase:
          name: minecraft-monitor-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: minecraft-monitor-db
          property: port

      - key: DB_NAME
        fromDatabase:
          name: minecraft-monitor-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: minecraft-monitor-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: minecraft-monitor-db
          property: password

      - key: JWT_SECRET
        generateValue: true

      - key: APP_USERNAME
        value: admin

      - key: APP_PASSWORD
        generateValue: true

      - key: CORS_ALLOWED_ORIGINS
        value: https://minecraft-server-monitor-ruddy.vercel.app

databases:
  - name: minecraft-monitor-db
    plan: free
    databaseName: minecraft_monitor
    user: minecraft